<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ropa+Sans:ital@0;1&display=swap" rel="stylesheet">

<div class="retro-header" (click)="toggleView($event)">
  <h1 class="retro-title-disks">
    <span class="vinyl-decoration">⚫</span>
    Discos
    <span class="vinyl-decoration">⚫</span>
  </h1>
  <button class="retro-toggle-button">
    <span class="retro-chevron" [class.rotated]="mostrar"></span>
  </button>
</div>

<main class="retro-main">
    @if (mostrar) {
    <div class="row">
        @for (disk of disks; track disk.title) {
        <div class="col-12 col-md-6 col-lg-4 mb-4">
            <div class="retro-card">
                <div class="retro-card-img-wrapper">
                    <img class="retro-card-img" [src]="disk.image" alt="{{ disk.title }}">
                </div>
                <div class="retro-card-body">
                    <h2 class="retro-card-title">{{ disk.title }}</h2>
                    <p class="retro-card-artist">🎤 {{ disk.artist }}</p>
                    <p class="retro-card-year">📅 {{ disk.year }}</p>
                    <p class="retro-card-description">{{ disk.description }}</p>
                    <app-input [disk]="disk" (likeToggled)="onLikeToggled($event)"></app-input>
                </div>
            </div>
        </div>
        }@empty{
        <p class="retro-empty-message">No hay discos para mostrar.</p>
        }
    </div>
    }
</main>

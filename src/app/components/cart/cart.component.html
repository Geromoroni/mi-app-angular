<h1 class="title-card">Discos Favoritos</h1>
<div class="row">
  <div class="col-12 mb-3" *ngFor="let disk of getFavorites()">
    <div class="card mb-3 position-relative" style="max-width: 540px;">
      <button 
        class="btn btn-secondary position-absolute" 
        (click)="removeFromFavorites(disk)">
        💔
      </button>
      <div class="row g-0">
        <div class="col-md-4">
          <img [src]="disk.image" class="img-fluid rounded-start h-100" [alt]="disk.title">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title">{{ disk.title }}</h5>
            <p class="card-text">Artista: {{ disk.artist }}</p>
            <p class="card-text">Año: {{ disk.year }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
